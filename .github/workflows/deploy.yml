name: 데이터 반영 및 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: kb 폴더의 KB 엑셀을 데이터에 합치기
        run: |
          if ls kb/*.xls* >/dev/null 2>&1; then
            npm install --prefix /tmp/kbdeps xlsx@0.18.5 --no-audit --no-fund
            XLSX_DIR=/tmp/kbdeps node scripts/update.mjs
            git config user.name "kb-dashboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data kb
            git commit -m "KB 주간 데이터 반영" || echo "변경 없음"
            git push
          else
            echo "새 KB 파일 없음 — 페이지만 배포해요"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
